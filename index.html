<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>あなた専属のソーイング・アシスタント</title>
<meta name="description" content="あなたの型紙アーカイブをもとに作った、AIソーイング・アシスタントです。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="ソーイング・アシスタント">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="estilos.css?v=1">
</head>
<body>

<header class="cabecera">
  <div class="marca">
    <div class="avatar" id="avatar">
      <img src="logo.jpg" alt="" id="logo" onerror="this.remove()">
      <span class="iniciales">縫</span>
    </div>
    <div class="marca-texto">
      <h1>あなた専属のソーイング・アシスタント</h1>
      <p>型紙アーカイブ · 1,500点以上</p>
    </div>
    <span class="etiqueta">AIアシスタント</span>
  </div>
  <div class="acciones">
    <div class="contador" id="contador" aria-live="polite"></div>
    <button type="button" class="nuevo" id="nuevo" hidden>新しい相談</button>
  </div>
</header>

<main class="hilo" id="hilo" role="log" aria-live="polite" aria-label="会話">

  <section class="bienvenida" id="bienvenida">
    <div class="avatar avatar-grande" aria-hidden="true">
      <img src="logo.jpg" alt="" onerror="this.remove()">
      <span class="iniciales">縫</span>
    </div>
    <h2>こんにちは！今日は何を縫いますか？</h2>
    <p class="bajada">
      型紙アーカイブのすべてのデザイン、サイズ表、作り方の手順を知っています。
      気軽に質問したり、写真を送ったり、下の質問をタップしてください。
    </p>
    <div class="sugerencias">
      <button class="sugerencia" type="button">縫っていてうまくいきませんでした。写真を送ってもいいですか？</button>
      <button class="sugerencia" type="button">私のサイズはこちらです。どの型紙のどのサイズで切ればいいですか？</button>
      <button class="sugerencia" type="button">私の型紙には、生地がどれくらい必要ですか？</button>
      <button class="sugerencia" type="button">型紙をきれいに印刷して、ページをつなぐ方法を教えてください。</button>
    </div>
  </section>

</main>

<div class="pie">
  <div class="adjunto" id="adjunto" hidden>
    <img id="adjunto-img" alt="送信する写真">
    <button type="button" id="quitar-foto" aria-label="写真を外す">×</button>
  </div>
  <form class="compositor" id="compositor">
    <button type="button" id="foto" class="boton-foto" aria-label="写真を追加" title="写真を追加">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M4 8h3l2-2.5h6L17 8h3v11H4z" fill="none" stroke="currentColor"
              stroke-width="1.9" stroke-linejoin="round"/>
        <circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="1.9"/>
      </svg>
    </button>
    <input type="file" id="archivo" accept="image/*" hidden>
    <textarea id="entrada" rows="1" placeholder="アシスタントに質問してみましょう…"
              enterkeyhint="send" autocomplete="off"
              aria-label="アシスタントに質問"></textarea>
    <button type="submit" id="enviar" aria-label="送信">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M12 20V5M5 12l7-7 7 7" fill="none" stroke="currentColor"
              stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>
  <p class="aviso">
    AI（人工知能）によるアシスタントのため、間違えることがあります。高価な生地を切る前に、必ずご自身の本のサイズ表で確認してください。
    ソーイングに関するご相談のみで、医療・法律・金融のアドバイスはしません。
    子ども服やペット服では、必ず安全上の注意を守ってください。
  </p>
</div>

<script src="app.js?v=1"></script>
</body>
</html>
